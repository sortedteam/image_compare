buildscript {
    ext {
        legacyFlutter = [
                minSdkVersion    : 24,
                targetSdkVersion : 35,
                compileSdkVersion: 35
        ]
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}

subprojects {
    if (project.name != 'app' && !project.hasProperty('flutter')) {
        project.ext.set('flutter', [
                minSdkVersion    : rootProject.ext.legacyFlutter.minSdkVersion,
                targetSdkVersion : rootProject.ext.legacyFlutter.targetSdkVersion,
                compileSdkVersion: rootProject.ext.legacyFlutter.compileSdkVersion
        ])
    }

    afterEvaluate { project ->
        if (project.plugins.hasPlugin("com.android.application") ||
                project.plugins.hasPlugin("com.android.library")) {
            project.android {
                compileSdkVersion rootProject.ext.legacyFlutter.compileSdkVersion
                buildToolsVersion "35.0.0"

                if (project.plugins.hasPlugin("com.android.library")) {
                    compileOptions {
                        sourceCompatibility JavaVersion.VERSION_17
                        targetCompatibility JavaVersion.VERSION_17
                    }

                    if (project.plugins.hasPlugin("org.jetbrains.kotlin.android") ||
                            project.plugins.hasPlugin("kotlin-android")) {
                        kotlinOptions {
                            jvmTarget = '17'
                        }
                    }

                    if (project.android.hasProperty('defaultConfig')) {
                        project.android.defaultConfig {
                            minSdkVersion rootProject.ext.legacyFlutter.minSdkVersion
                            targetSdkVersion rootProject.ext.legacyFlutter.targetSdkVersion
                        }
                    }
                }
            }
        }
    }
}

subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
